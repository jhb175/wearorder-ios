services:
  wearorder-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wearorder-api
    restart: unless-stopped

    # Internal-testing default: bind directly to host port 80 over
    # plain HTTP. Swap to a bridged setup with Nginx + Let's Encrypt
    # before serving real users — see TENCENT_CLOUD_GUIDE.md.
    ports:
      - "80:8080"

    environment:
      LISTEN_ADDR: "0.0.0.0:8080"
      DATA_PATH: "/data/wearorder.db"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      RATE_LIMIT_PER_DAY: "${RATE_LIMIT_PER_DAY:-30}"
      BURST_LIMIT_PER_MINUTE: "${BURST_LIMIT_PER_MINUTE:-5}"
      REQUEST_TIMEOUT_SEC: "${REQUEST_TIMEOUT_SEC:-60}"
      # SESSION_SECRET is loaded from .env (generated by docker-install.sh).
      # ADMIN_INITIAL_PASSWORD intentionally NOT set — the binary will
      # generate a random one and print it to its stderr (visible via
      # `docker compose logs`) on the first start.

    env_file:
      - .env

    volumes:
      - wearorder-data:/data

    # Reasonable file descriptor cap for an HTTP server.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  wearorder-data:
    driver: local
